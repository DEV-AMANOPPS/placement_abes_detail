<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ABES Placement 2025</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --card: #111111;
    --border: #1a1a1a; --border2: #2a2a2a;
    --accent: #6d28d9; --accent2: #06b6d4; --accent4: #10b981;
    --danger: #ef4444; --text: #ffffff; --muted: #888888; --highlight: #c4b5fd;
    --accent-glow: rgba(109,40,217,0.3); --cyan-glow: rgba(6,182,212,0.2);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  /* Ambient glows */
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 10%, rgba(109,40,217,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(6,182,212,0.1) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(109,40,217,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(109,40,217,0.04) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 0;
  }

  .auth-card {
    position: relative; z-index: 10;
    background: rgba(17,17,17,0.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(109,40,217,0.2);
    border-radius: 24px;
    padding: 44px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 64px rgba(0,0,0,0.5), 0 0 80px rgba(109,40,217,0.08);
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-logo {
    display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
  }
  .auth-logo .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; box-shadow: 0 4px 20px var(--accent-glow); flex-shrink: 0;
  }
  .auth-logo .logo-text { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
  .auth-logo .logo-sub  { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }

  h1 {
    font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff 0%, var(--highlight) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .auth-subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 30px; }

  .form-group { margin-bottom: 16px; position: relative; }
  .form-label {
    display: block; font-size: 0.78rem; font-weight: 600;
    color: var(--muted); margin-bottom: 7px; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .form-input {
    width: 100%; padding: 13px 16px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border2);
    border-radius: 12px; color: var(--text);
    font-family: 'Inter', system-ui, sans-serif; font-size: 0.9rem;
    outline: none; transition: all 0.2s;
  }
  .form-input::placeholder { color: #444; }
  .form-input:focus {
    border-color: var(--accent);
    background: rgba(109,40,217,0.07);
    box-shadow: 0 0 0 3px rgba(109,40,217,0.15);
  }
  .form-input:focus + .form-icon { color: var(--accent); }

  .form-icon {
    position: absolute; right: 14px; top: 38px;
    color: #444; font-size: 0.9rem; transition: color 0.2s;
    pointer-events: none;
  }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #4c1d95);
    border: none; border-radius: 12px; color: white;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
    transition: all 0.3s; box-shadow: 0 4px 20px var(--accent-glow);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 6px;
  }
  .btn-primary:hover {
    transform: translateY(-2px); box-shadow: 0 8px 28px var(--accent-glow);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .auth-divider {
    text-align: center; margin: 20px 0;
    font-size: 0.78rem; color: var(--muted); position: relative;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; position: absolute; top: 50%; width: calc(50% - 20px);
    height: 1px; background: var(--border2);
  }
  .auth-divider::before { left: 0; }
  .auth-divider::after  { right: 0; }

  .auth-link {
    text-align: center; font-size: 0.85rem; color: var(--muted); margin-top: 20px;
  }
  .auth-link a { color: var(--highlight); text-decoration: none; font-weight: 600; }
  .auth-link a:hover { text-decoration: underline; }

  .message-box {
    margin-top: 14px; padding: 12px 16px; border-radius: 10px;
    font-size: 0.83rem; font-weight: 500; display: none;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px);} to {opacity:1;transform:translateY(0);} }
  .message-box.error  { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; display: block; }
  .message-box.success{ background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; display: block; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-text { display: none; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">ABES Placement</div>
      <div class="logo-sub">2025 Prep Portal</div>
    </div>
  </div>

  <h1>Welcome Back</h1>
  <p class="auth-subtitle">Sign in to continue your placement journey.</p>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
      <span class="form-icon">✉</span>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      <span class="form-icon">🔒</span>
    </div>
    <button type="submit" class="btn-primary" id="loginBtn">
      <div class="spinner"></div>
      <span class="btn-text">Sign In →</span>
    </button>
  </form>

  <div id="loginMessage" class="message-box"></div>

  <p class="auth-link">Don't have an account? <a href="register.html">Create one free</a></p>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
