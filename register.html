<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ABES Placement Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --card: #111111;
    --border: #1a1a1a; --border2: #222222;
    --accent: #6d28d9; --accent2: #06b6d4;
    --text: #ffffff; --muted: #888888; --highlight: #c4b5fd;
    --accent-glow: rgba(109,40,217,0.25);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(109,40,217,0.15) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(109,40,217,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(109,40,217,0.04) 1px, transparent 1px);
    background-size: 48px 48px; pointer-events: none; z-index: 0;
  }
  .auth-container {
    width: 100%; max-width: 420px; padding: 40px;
    background: rgba(10,10,10,0.8); backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; z-index: 1;
  }
  .auth-header { text-align: center; margin-bottom: 30px; }
  .auth-header h1 {
    font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 0%, var(--highlight) 50%, var(--accent2) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .auth-header p { color: var(--muted); font-size: 0.9rem; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .form-control {
    width: 100%; padding: 14px 16px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 12px; color: var(--text);
    font-family: inherit; font-size: 0.95rem; transition: all 0.3s;
  }
  .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .btn-primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #4c1d95);
    border: none; border-radius: 12px; color: white; font-weight: 700; font-size: 1rem;
    cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 14px var(--accent-glow); margin-top: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-glow); }
  .auth-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
  .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: 600; transition: color 0.2s; }
  .auth-footer a:hover { color: var(--highlight); }
  #errorMsg { color: #f87171; font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-header">
    <h1>Create Account</h1>
    <p>Join the ABES 2025 Placement Portal</p>
  </div>
  
  <form id="registerForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" class="form-control" placeholder="Aman Sharma" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="user@abes.ac.in" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <div id="errorMsg"></div>
    <button type="submit" class="btn-primary" id="submitBtn">Sign Up</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Login here</a>
  </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  
  btn.disabled = true;
  btn.innerText = 'Creating account...';
  errorMsg.style.display = 'none';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    
    const data = await res.json();
    
    if(!res.ok) {
      throw new Error(data.error || 'Failed to register');
    }
    
    // Successfully registered, save user data
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    
    // Redirect to dashboard
    window.location.href = 'index.html';
  } catch(err) {
    errorMsg.innerText = err.message;
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.innerText = 'Sign Up';
  }
});
</script>
</body>
</html>
